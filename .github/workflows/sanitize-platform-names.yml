name: Sanitize platform names

on:
  push:
    branches: [ "clear-v2.0.1" ]

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clear-v2.0.1

      - name: Remove platform-name references
        run: python3 .github/sanitize3.py

      - name: Commit sanitized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove platform-name references"
          git push origin HEAD:clear-v2.0.1
