name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Assemble Windows source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path windows\build | Out-Null
          $parts = Get-ChildItem windows\src\YTGrab.part*.cs.txt | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 Windows source parts, found $($parts.Count)." }
          $text = foreach ($part in $parts) { Get-Content $part.FullName -Raw }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'windows\build\Vidown.cs'), ($text -join "`r`n"), (New-Object System.Text.UTF8Encoding($false)))

      - name: Apply Vidown desktop changes
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows\patch-vidown.ps1 -Path windows\build\Vidown.cs

      - name: Compile Windows app
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "Windows .NET Framework compiler not found." }
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu /out:windows\build\Vidown.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll windows\build\Vidown.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path windows\build\Vidown.exe)) { throw "Vidown.exe was not produced." }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc windows\installer\Vidown.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path windows\installer\output\Vidown_Setup_v2.0.1.exe)) { throw "Installer was not produced." }

      - uses: actions/upload-artifact@v4
        with:
          name: Vidown-Windows-Installer
          path: windows/installer/output/Vidown_Setup_v2.0.1.exe

      - name: Upload installer to latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --limit 1 --json tagName --jq '.[0].tagName'
          gh release upload $tag windows/installer/output/Vidown_Setup_v2.0.1.exe --clobber
